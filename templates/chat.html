<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <style>
    :root{
      --bg:#0b1220;
      --panel:rgba(255,255,255,0.06);
      --panel2:rgba(255,255,255,0.08);
      --border:rgba(255,255,255,0.10);
      --text:rgba(255,255,255,0.92);
      --muted:rgba(255,255,255,0.65);
      --me:#1f6feb;
      --me2:rgba(31,111,235,0.25);
      --other:rgba(255,255,255,0.10);
      --shadow:0 20px 60px rgba(0,0,0,0.35);
    }

    body{ background:var(--bg); color:var(--text); }
    .shell{ max-width: 980px; }

    .topbar{
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .avatar{
      width: 38px; height: 38px; border-radius: 999px;
      background: rgba(13,110,253,0.25);
      border: 1px solid rgba(13,110,253,0.35);
      display:flex; align-items:center; justify-content:center;
      font-weight: 700;
    }

    .chat-wrap{
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      height: calc(100vh - 190px);
      min-height: 420px;
      border-radius: 1.25rem;
      overflow: hidden;
      display:flex;
      flex-direction: column;
    }

    /* WhatsApp-like background pattern (subtle) */
    .messages{
      flex:1;
      overflow:auto;
      padding: 18px 16px;
      background:
        radial-gradient(circle at 20px 20px, rgba(255,255,255,0.04) 2px, transparent 2px) 0 0/44px 44px,
        radial-gradient(circle at 0 0, rgba(13,110,253,0.05) 1px, transparent 1px) 0 0/34px 34px,
        linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.00));
    }

    .bubble-row{
      display:flex;
      margin-bottom: 10px;
      gap: 10px;
      align-items: flex-end;
    }
    .bubble-row.me{ justify-content:flex-end; }
    .bubble-row.other{ justify-content:flex-start; }

    .bubble{
      max-width: min(78%, 560px);
      padding: 10px 12px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: var(--other);
      position: relative;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .bubble.me{
      background: linear-gradient(180deg, rgba(31,111,235,0.35), rgba(31,111,235,0.22));
      border-color: rgba(31,111,235,0.35);
    }

    .meta{
      display:flex;
      gap: 8px;
      justify-content: space-between;
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .name{ font-weight: 600; color: rgba(255,255,255,0.85); }

    .composer{
      padding: 12px;
      border-top: 1px solid var(--border);
      background: rgba(0,0,0,0.10);
    }

    .composer .form-control{
      background: var(--panel2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 999px;
      padding: 12px 14px;
    }
    .composer .form-control::placeholder{ color: rgba(255,255,255,0.55); }
    .composer .form-control:focus{
      box-shadow: 0 0 0 .25rem rgba(13,110,253,.20);
      border-color: rgba(13,110,253,.55);
    }

    .send-btn{
      border-radius: 999px;
      padding: 10px 14px;
      border: 1px solid rgba(13,110,253,0.35);
      background: rgba(13,110,253,0.22);
      color: #eaf2ff;
    }
    .send-btn:hover{ background: rgba(13,110,253,0.30); }

    .pill{
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.06);
      border-radius: 999px;
      padding: 6px 10px;
      color: var(--muted);
      font-size: 12px;
    }

    /* Nice scrollbar */
    .messages::-webkit-scrollbar { width: 10px; }
    .messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 999px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>

<body>
  <div class="container shell py-4">

    <!-- Top Bar -->
    <div class="topbar rounded-4 px-3 py-3 d-flex align-items-center justify-content-between mb-3">
      <div class="d-flex align-items-center gap-3">
        <div class="avatar">{{ username[:1].upper() }}</div>
        <div>
          <div class="fw-semibold">Chat</div>
          <div class="small" style="color: rgba(255,255,255,0.65);">Logged in as <span class="fw-semibold text-white">{{ username }}</span></div>
        </div>
      </div>

      <div class="d-flex align-items-center gap-2">
        <div class="pill" id="connStatus">Connecting…</div>
        <a href="/logout" class="btn btn-outline-light btn-sm rounded-pill">Logout</a>
      </div>
    </div>

    <!-- Chat Container -->
    <div class="chat-wrap">
      <div id="messages" class="messages"></div>

      <!-- Composer -->
      <div class="composer">
        <form id="chatForm" class="d-flex gap-2 align-items-center">
          <input id="msg" class="form-control" placeholder="Message…" autocomplete="off" />
          <button type="submit" class="send-btn">Send</button>
        </form>
        <div class="mt-2 small" style="color: rgba(255,255,255,0.55);">
          Press <span class="pill">Enter</span> to send • <span class="pill">Shift + Enter</span> for new line
        </div>
      </div>
    </div>

  </div>

  <script>
    // Pass current username to JS for "me vs others" rendering
    window.CURRENT_USERNAME = {{ username|tojson }};
  </script>
  <script src="/static/chat.js" defer></script>
</body>
</html>
