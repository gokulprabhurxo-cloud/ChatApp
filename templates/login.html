<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login • Chat</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background:#0b1220; }
    .card {
      border: 0;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    .text-muted-2 { color: rgba(255,255,255,0.65) !important; }
    .form-control {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff;
    }
    .form-control::placeholder { color: rgba(255,255,255,0.55); }
    .form-control:focus {
      box-shadow: 0 0 0 .25rem rgba(13,110,253,.25);
      border-color: rgba(13,110,253,.55);
    }
    .brand-dot { width: 10px; height: 10px; border-radius: 999px; background: #0d6efd; display:inline-block; }
    a { text-decoration: none; }
  </style>
</head>

<body class="text-white">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">

        <div class="text-center mb-4">
          <div class="mb-2">
            <span class="brand-dot me-2"></span>
            <span class="fw-semibold">Chat App</span>
          </div>
          <div class="text-muted-2">Log in to continue.</div>
        </div>

        <div class="card rounded-4 p-4">
          {% with messages = get_flashed_messages() %}
            {% if messages %}
              <div class="alert alert-danger rounded-4" role="alert">
                {{ messages[0] }}
              </div>
            {% endif %}
          {% endwith %}

          <form method="post" class="vstack gap-3">
            <div>
              <label class="form-label text-muted-2">Username</label>
              <input class="form-control form-control-lg" name="username" placeholder="Enter username" required>
            </div>

            <div>
              <label class="form-label text-muted-2">Password</label>
              <div class="input-group input-group-lg">
                <input id="password" class="form-control" type="password" name="password" placeholder="Enter password" required>
                <button class="btn btn-outline-light" type="button" id="togglePwd">Show</button>
              </div>
            </div>

            <button class="btn btn-primary btn-lg w-100" type="submit">Login</button>

            <div class="text-center text-muted-2">
              Don’t have an account?
              <a href="/register" class="text-white fw-semibold">Create one</a>
            </div>
          </form>
        </div>

        <div class="mt-3 text-center text-muted-2 small">
          Tip: Use a strong password.
        </div>

      </div>
    </div>
  </div>

  <script>
    const toggle = document.getElementById("togglePwd");
    const pwd = document.getElementById("password");
    toggle.addEventListener("click", () => {
      const isPwd = pwd.type === "password";
      pwd.type = isPwd ? "text" : "password";
      toggle.textContent = isPwd ? "Hide" : "Show";
    });
  </script>
</body>
</html>
